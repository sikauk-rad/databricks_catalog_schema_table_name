[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[project]
name = "databricks_catalog_schema_table_name"
description = "Simple object-oriented management of Databricks catalog-schema-table names."
version = "0.1.0"
authors = [
  {name = "Milan Kundra", email = "kundra.milan@fr.sika.com"},
]
readme = "README.md"
requires-python = ">=3.11"
keywords = ["databricks", "pyspark", "api", "msgspec", "catalog", "schema", "table"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
dependencies = [
    "msgspec",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "mypy",
    "ruff",
]

[project.urls]
Homepage = "https://github.com/sikauk-rad/databricks_catalog_schema_table_name"
Repository = "https://github.com/sikauk-rad/databricks_catalog_schema_table_name"

[tool.hatch.build.targets.wheel]
packages = ["src/databricks_catalog_schema_table_name"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
warn_redundant_casts = true

[tool.ruff]
target-version = "py311"
line-length = 90